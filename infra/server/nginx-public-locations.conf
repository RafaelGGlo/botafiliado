# Include ONLY inside an existing TLS server block. Keep the dashboard private.
# This file does not set certificates, domains, or other sites' routing.
location = /webhooks/instagram {
    limit_except GET POST { deny all; }
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:3210;
    proxy_set_header Host 127.0.0.1:3210;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    access_log off;
}
location ~ ^/instagram-media/[a-f0-9-]{36}\.jpg$ {
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:3210;
    proxy_set_header Host 127.0.0.1:3210;
    proxy_set_header X-Forwarded-For $remote_addr;
    access_log off;
}
location / { return 404; }
