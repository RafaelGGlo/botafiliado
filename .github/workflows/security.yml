name: Security and offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['.', 'instagram-publish', 'instagram-publish/whatsapp-bot']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: instagram-publish
      - run: npm ci --ignore-scripts
        working-directory: instagram-publish/whatsapp-bot
      - run: npm test
        working-directory: ${{ matrix.package }}
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: ${{ matrix.package }}
      - run: git check-ignore whatsapp-bot/whatsapp_queue.json instagram-publish/whatsapp-bot/whatsapp_queue.json instagram-publish/whatsapp-bot/whatsapp_groups.json
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r instagram-publisher/requirements.txt
      - run: python -m unittest discover -s instagram-publisher -p test_publisher.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
